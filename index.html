    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does Wynflow do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Wynflow is job and customer management software for New Zealand tradies. It helps you quote faster, follow up with customers automatically, and keep every job organised — from the first enquiry through to a paid invoice."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a free trial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — 14 days full access, no credit card needed. Send real quotes from day one."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Wynflow cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Wynflow Starter is $29/month NZD and Pro is $49/month NZD. Both include unlimited quotes, automated follow-up sequences, a customer quote request page, and analytics. Pro adds advanced analytics and premium support. Free 14-day trial, no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. No lock-in contracts, no cancellation fees."
          }
        },
        {
          "@type": "Question",
          "name": "What trades does Wynflow work for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Wynflow works for all trades — plumbers, electricians, builders, painters, roofers, landscapers, carpet layers, tilers, cleaners, handymen, mechanics, fencers, and more. Set your trade and rates once, and Wynflow tailors quotes and follow-ups to your business."
          }
        },
        {
          "@type": "Question",
          "name": "Do my customers know the follow-ups are automated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Emails come from Wynflow on behalf of your business name. They look professional and personal — your customers just think you're on the ball."
          }
        }
      ]
    }
    </script>
